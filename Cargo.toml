[package]
name = "drifting-void"
version = "0.54.1"
edition = "2024"

[[bin]]
name = "DriftingVOID"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2.32"
arboard = "3.7.0"
cpal = "0.18.2"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui = { version = "0.36.2", default-features = false, features = ["serde"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
memmap2 = "0.9.11"
raw-window-handle = "0.6"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
tiny-skia = "0.12.0"
ttf-parser = "0.25"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Input_Pointer", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1.34"
